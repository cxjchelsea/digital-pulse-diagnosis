[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-pulse-diagnosis"
version = "0.1.0"
description = "P0 protocol, simulator, and signal-processing baseline for digital pulse acquisition"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
pulse-simulator = "digital_pulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

