[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-radial-pulse"
version = "0.1.0"
description = "Adaptive radial pulse acquisition, signal processing, control simulation, and objective analysis"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.9"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "jsonschema>=4.20",
]

[project.scripts]
pulse-simulator = "digital_pulse.cli:main"
pulse-api = "digital_pulse.api:main"

[tool.setuptools.packages.find]
where = ["src"]
