[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-pulse-diagnosis"
version = "0.1.0"
description = "P0 protocol, simulator, and signal-processing baseline for digital pulse acquisition"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.9"]

[project.scripts]
pulse-simulator = "digital_pulse.cli:main"
pulse-api = "digital_pulse.api:main"

[tool.setuptools.packages.find]
where = ["src"]
