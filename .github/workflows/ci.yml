name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

jobs:
  python:
    name: Python tests and D3 acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest -q

      - name: Run unittest compatibility suite
        run: python -m unittest discover -s tests -v

      - name: Generate D3 acceptance evidence
        run: python scripts/generate_d3_acceptance.py --evidence-source github-actions

      - name: Upload D3 acceptance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: d3-acceptance
          path: artifacts/d3-acceptance/

  web:
    name: Web production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install and build
        run: |
          npm ci
          npm run build
