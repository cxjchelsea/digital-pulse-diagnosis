name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

jobs:
  python:
    name: Python tests and D3 acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest -q

      - name: Run unittest compatibility suite
        run: python -m unittest discover -s tests -v

      - name: Generate D3 acceptance evidence
        run: python scripts/generate_d3_acceptance.py

      - name: Assert formal acceptance
        run: >
          python -c "import json; from pathlib import Path;
          d=json.loads(Path('artifacts/d3-acceptance/acceptance.json').read_text(encoding='utf-8'));
          assert d.get('formal_acceptance') is True, d.get('failed_gates');
          assert d.get('evidence_source') == 'github-actions';
          assert d.get('config_hashes', {}).get('combined_sha256');
          assert len(d.get('traceability_D3_T01_T24') or []) == 24;
          assert all(item.get('passed') for item in d['traceability_D3_T01_T24'])"

      - name: Upload D3 acceptance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: d3-acceptance
          path: artifacts/d3-acceptance/

  web:
    name: Web production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install and build
        run: |
          npm ci
          npm run build
